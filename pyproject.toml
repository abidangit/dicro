[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dicro"
version = "0.1.0"
description = "Pattern-aware universal compression toolkit inspired by the universal pattern engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "abidangit" }]
license = { text = "MIT" }
keywords = ["compression", "patterns", "sequences", "algorithms", "math"]

[project.scripts]
dicro = "dicro.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
include = ["dicro*"]
